<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="해솔마을 그림 갤러리">
<title>갤러리 | 해솔마을</title>
<style>
:root{
  --sea-deep:#1d4e7a; --sea:#2f7bb5; --sea-light:#8cc3e6;
  --sunset:#f28b5b; --sunset-light:#ffd28a; --dusk:#6a4c8c;
  --ink:#24323f; --muted:#5d6b78; --paper:#fffaf3; --card:#ffffff;
  --line:#efe2d2; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.7;font-size:16px}
a{color:inherit}
img,svg{display:block;max-width:100%}

/* 메뉴 */
.site-header{position:sticky;top:0;z-index:10;background:rgba(255,250,243,.95);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav-wrap{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;
  color:var(--sea-deep);text-decoration:none;white-space:nowrap}
.menu-btn{display:none;background:var(--sea-deep);color:#fff;border:0;border-radius:10px;
  padding:8px 14px;font-size:1rem;cursor:pointer;font-family:inherit}
.menu{display:flex;flex-wrap:wrap;gap:4px;list-style:none;justify-content:flex-end}
.menu a{display:block;padding:6px 10px;border-radius:999px;text-decoration:none;
  font-size:.92rem;color:var(--ink);white-space:nowrap}
.menu a:hover{background:#fbe9d8}
.menu a.active{background:var(--sunset);color:#fff;font-weight:700}

/* 공통 */
main{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.hero{margin:20px 0 28px;border-radius:24px;overflow:hidden;position:relative;
  box-shadow:0 10px 30px rgba(29,78,122,.15)}
.hero svg{width:100%;height:auto}
.hero-text{position:absolute;left:0;right:0;bottom:0;padding:24px;
  background:linear-gradient(transparent,rgba(20,40,70,.65));color:#fff}
.hero-text h1{font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.3}
.hero-text p{font-size:clamp(.95rem,2.2vw,1.15rem);opacity:.95}
h2{font-size:1.5rem;color:var(--sea-deep);margin:32px 0 14px}
h3{font-size:1.15rem;color:var(--sea-deep)}
.lead{font-size:1.08rem;color:var(--muted);margin-bottom:12px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.04);display:flex;flex-direction:column}
.card svg{width:100%;height:auto;aspect-ratio:4/3}
.card-body{padding:14px 16px 18px}
.card-body p{color:var(--muted);font-size:.95rem}
a.card{text-decoration:none;transition:transform .2s,box-shadow .2s}
a.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(29,78,122,.15)}
.more{display:inline-block;margin-top:6px;color:var(--sunset);font-weight:700}
.card-body .price{margin-top:6px;font-weight:800;color:var(--sunset)}
.tag{display:inline-block;background:#fbe9d8;color:#a5512a;border-radius:999px;
  padding:2px 10px;font-size:.8rem;margin-bottom:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.two{display:grid;gap:24px;grid-template-columns:1fr 1fr;align-items:center}
.two svg{border-radius:var(--radius);width:100%;height:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sea-deep);color:#fff;font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.info th{background:#f6ede2;color:var(--sea-deep);width:30%}

/* 시간표 (코스) */
.timeline{list-style:none;position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;
  background:linear-gradient(var(--sea),var(--sunset));border-radius:2px}
.timeline li{position:relative;margin-bottom:16px}
.timeline li::before{content:"";position:absolute;left:-24px;top:7px;width:14px;height:14px;
  border-radius:50%;background:#fff;border:3px solid var(--sunset)}
.timeline .time{font-weight:800;color:var(--sea-deep);margin-right:8px}
.day{font-weight:800;color:var(--dusk);margin:10px 0 8px}

/* 갤러리 */
.gallery{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.gallery figure{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.gallery svg{width:100%;height:auto;aspect-ratio:1/1}
.gallery figcaption{padding:8px 12px;font-size:.9rem;color:var(--muted)}

/* FAQ */
.faq-item{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:12px;overflow:hidden}
.faq-q{width:100%;text-align:left;background:none;border:0;padding:16px 48px 16px 18px;
  font-size:1.02rem;font-weight:700;color:var(--sea-deep);cursor:pointer;position:relative;font-family:inherit}
.faq-q::after{content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:1.5rem;color:var(--sunset);transition:transform .2s}
.faq-item.open .faq-q::after{transform:translateY(-50%) rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px;color:var(--muted)}
.faq-item.open .faq-a{padding-bottom:16px}

/* 아래: 연락처 */
.site-footer{background:var(--sea-deep);color:#e5f0fa;margin-top:24px}
.footer-wrap{max-width:1100px;margin:0 auto;padding:28px 16px;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.site-footer strong{color:var(--sunset-light);display:block;margin-bottom:4px}
.site-footer small{display:block;text-align:center;padding:12px;border-top:1px solid rgba(255,255,255,.15);opacity:.75}

/* 휴대폰 */
@media (max-width:860px){
  .menu-btn{display:block}
  .menu{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;
    background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px 14px;gap:2px}
  .menu.open{display:flex}
  .menu a{border-radius:10px;padding:10px 12px;font-size:1rem}
  .two{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .hero-text{padding:16px}
  .hero svg{min-height:280px;object-fit:cover}
}
@media (max-width:420px){ .gallery{grid-template-columns:1fr} }
</style>
</head>

  document.querySelectorAll('.faq-q').forEach(function(q){

      var open=item.classList.toggle('open');

    });
  });
})();
